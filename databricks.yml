# ============================================================
# NYC Mobility Pipeline — Databricks Asset Bundle
#
# The task graph from docs/job_setup.md, under version control.
#
# A Job rather than a declarative ETL pipeline: the loads MERGE into our own
# tables, the control tables are ours, and each gate must FAIL its task so
# later stages are skipped. Dependencies are what enforce the gates.
#
# Deploy:  databricks bundle deploy -t dev
# Run:     databricks bundle run nyc_mobility_pipeline -t dev
# ============================================================

bundle:
  name: nyc-mobility-pipeline

variables:
  warehouse_id:
    description: SQL warehouse that runs every SQL file task. Required.
    default: ""
  alert_email:
    description: Address notified when a task fails.
    default: ""

targets:
  dev:
    mode: development
    default: true
    workspace:
      root_path: /Workspace/Users/${workspace.current_user.userName}/.bundle/${bundle.name}/${bundle.target}

  prod:
    mode: production
    workspace:
      root_path: /Workspace/Shared/.bundle/${bundle.name}/${bundle.target}
    resources:
      jobs:
        nyc_mobility_pipeline:
          # Paused until the incremental and idempotency proofs are recorded
          # under evidence/proof/. A schedule on an unproven pipeline just
          # produces unattended failures.
          schedule:
            quartz_cron_expression: "0 0 6 * * ?"
            timezone_id: America/New_York
            pause_status: PAUSED

resources:
  jobs:
    nyc_mobility_pipeline:
      name: nyc-mobility-pipeline

      # A run that overruns has usually stalled on a cluster, not on data.
      timeout_seconds: 7200
      max_concurrent_runs: 1

      email_notifications:
        on_failure:
          - ${var.alert_email}

      tasks:

        # ---------- 01 Control ----------
        - task_key: control_setup
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/01_control/00_create_control_tables.sql

        # ---------- 02 Bronze ----------
        # The three sources are independent and run in parallel. They only
        # converge at Integration, so an unfinished source never blocks a
        # finished one (D17).
        - task_key: load_green_taxi
          depends_on: [{ task_key: control_setup }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/02_bronze/10_load_green_taxi.sql

        - task_key: load_open_meteo
          depends_on: [{ task_key: control_setup }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/02_bronze/20_load_open_meteo.sql

        - task_key: load_taxi_zones
          depends_on: [{ task_key: control_setup }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/02_bronze/30_load_taxi_zones.sql

        - task_key: gate_bronze_green_taxi
          depends_on: [{ task_key: load_green_taxi }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/02_bronze/90_validate_green_taxi.sql

        - task_key: gate_bronze_open_meteo
          depends_on: [{ task_key: load_open_meteo }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/02_bronze/90_validate_open_meteo_weather.sql

        - task_key: gate_bronze_taxi_zones
          depends_on: [{ task_key: load_taxi_zones }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/02_bronze/90_validate_taxi_zones.sql

        # The control gate checks ingestion_batches itself: batch_id uniqueness,
        # duplicate SUCCESS batches for one content hash, stuck batches and
        # lifecycle consistency. It runs after the loads because its first
        # check fails on an empty table by design, and Integration depends on
        # it: if the control table is wrong, nothing downstream can be trusted.
        - task_key: gate_control
          depends_on:
            - { task_key: load_green_taxi }
            - { task_key: load_open_meteo }
            - { task_key: load_taxi_zones }
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/01_control/90_validate_control.sql

        # ---------- 03 Silver ----------
        - task_key: clean_green_taxi
          depends_on: [{ task_key: gate_bronze_green_taxi }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/03_silver/10_clean_green_taxi.sql

        - task_key: clean_weather_hourly
          depends_on: [{ task_key: gate_bronze_open_meteo }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/03_silver/20_clean_weather_hourly.sql

        - task_key: clean_taxi_zones
          depends_on: [{ task_key: gate_bronze_taxi_zones }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/03_silver/30_clean_taxi_zones.sql

        - task_key: gate_silver_green_taxi
          depends_on: [{ task_key: clean_green_taxi }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/03_silver/90_validate_green_taxi.sql

        - task_key: gate_silver_weather_hourly
          depends_on: [{ task_key: clean_weather_hourly }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/03_silver/90_validate_weather_hourly.sql

        - task_key: gate_silver_taxi_zones
          depends_on: [{ task_key: clean_taxi_zones }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/03_silver/90_validate_taxi_zones.sql

        # ---------- 04 Integration ----------
        # First stage needing every source. The gate also asserts all three
        # Silver gates passed, so this holds even when a task is re-run alone.
        - task_key: resolve_trip_zones
          depends_on:
            - { task_key: gate_silver_green_taxi }
            - { task_key: gate_silver_weather_hourly }
            - { task_key: gate_silver_taxi_zones }
            - { task_key: gate_control }
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/04_integration/10_resolve_trip_zones.sql

        - task_key: resolve_trip_weather
          depends_on: [{ task_key: resolve_trip_zones }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/04_integration/20_resolve_trip_weather.sql

        - task_key: gate_integration
          depends_on: [{ task_key: resolve_trip_weather }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/04_integration/90_validate_integration.sql

        # ---------- 05 Gold ----------
        # Dimensions before facts: facts resolve keys only against built
        # dimensions, never back against the cleaned layer.
        - task_key: dim_date
          depends_on: [{ task_key: gate_integration }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/05_gold/10_dim_date.sql

        - task_key: dim_hour
          depends_on: [{ task_key: gate_integration }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/05_gold/11_dim_hour.sql

        - task_key: dim_taxi_zone
          depends_on: [{ task_key: gate_integration }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/05_gold/12_dim_taxi_zone.sql

        - task_key: dim_weather_classification
          depends_on: [{ task_key: gate_integration }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/05_gold/13_dim_weather_classification.sql

        - task_key: fact_weather_hourly
          depends_on:
            - { task_key: dim_date }
            - { task_key: dim_hour }
            - { task_key: dim_taxi_zone }
            - { task_key: dim_weather_classification }
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/05_gold/20_fact_weather_hourly.sql

        # The trip fact reads fact_weather_hourly as a build-time lookup for
        # the pickup-hour classification key, so it runs after it.
        - task_key: fact_taxi_trip
          depends_on: [{ task_key: fact_weather_hourly }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/05_gold/30_fact_taxi_trip.sql

        - task_key: gate_gold
          depends_on: [{ task_key: fact_taxi_trip }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/05_gold/90_validate_gold.sql

        # ---------- 06 Analytics ----------
        - task_key: analytics_activity
          depends_on: [{ task_key: gate_gold }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/06_analytics/10_activity_by_time_and_zone.sql

        - task_key: analytics_weather
          depends_on: [{ task_key: gate_gold }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/06_analytics/20_trip_behavior_by_weather.sql

        - task_key: analytics_zones
          depends_on: [{ task_key: gate_gold }]
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/06_analytics/30_mobility_patterns_by_zone.sql

        - task_key: gate_analytics
          depends_on:
            - { task_key: analytics_activity }
            - { task_key: analytics_weather }
            - { task_key: analytics_zones }
          sql_task:
            warehouse_id: ${var.warehouse_id}
            file:
              path: etl/06_analytics/90_validate_analytics.sql

        # Dashboards read validated Analytics results and are not job tasks.
