name: Reject ipynb files

on:
  pull_request:
    branches: [main]

jobs:
  check-ipynb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fail if .ipynb files are present
        run: |
          FILES=$(git diff --name-only origin/${{ github.base_ref }}...HEAD)
          echo "Changed files:"
          echo "$FILES"
          if echo "$FILES" | grep -q '\.ipynb$'; then
            echo "::error::.ipynb files are not allowed — use Databricks Source format (.py/.sql)"
            exit 1
          fi
